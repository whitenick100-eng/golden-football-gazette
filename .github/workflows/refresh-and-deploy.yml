name: Refresh ESPN and publish Gazette
on:
  workflow_dispatch:
  schedule:
    # Every four hours, retaining the original 13:17 UTC refresh.
    - cron: '17 1,5,9,13,17,21 * * *'
    # Dedicated pre-7 AM Eastern publishing attempt: 5:05 AM EST / 6:05 AM EDT.
    # GitHub schedules are best effort; the 7 AM verification task reports delays.
    - cron: '5 10 * * *'
    # Tuesday 8 AM Eastern: UTC candidates cover EST and EDT.
    - cron: '0 12,13 * * 2'
    # Tuesday second chance if GitHub delayed/dropped its scheduled run or
    # ESPN had not confirmed Monday-night final box scores at first refresh.
    # 10:47 a.m. EST / 11:47 a.m. EDT. No extra run on other days.
    - cron: '47 15 * * 2'
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: gazette-pages-deployment
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax and website structure
        run: |
          python -m py_compile scripts/*.py
          python scripts/qa_gazette.py
      - name: Stage last verified published snapshots before contacting ESPN
        run: python scripts/verified_data_guard.py preload
      - name: Refresh sanitized ESPN snapshot
        run: python scripts/refresh_espn.py
      - name: Refresh NASCAR.com-only official ticker headlines
        run: python scripts/refresh_nascar.py
      - name: Refresh weekly NFL schedule and weather
        run: python scripts/refresh_nfl.py
      - name: Refresh league-wide ESPN NFL injury report
        run: python scripts/refresh_nfl_injuries.py
      - name: Preserve weekly Top Five and refresh after Tuesday morning ESPN confirmation
        run: python scripts/refresh_player_leaders.py
      - name: Report Top Five actual week, ESPN finals, and publication status
        if: always()
        run: python scripts/leaderboard_health.py
      - name: Fetch verified NFL trades, waivers and releases
        run: python scripts/refresh_nfl_transactions.py
      - name: Generate daily verified football stories and playoff picture
        run: python scripts/build_weekly_features.py
      - name: Cache authentic fantasy emblems for Gridiron Giggles and matchups
        run: |
          python scripts/cache_fantasy_logos.py
          python -c "import json; d=json.load(open('assets/fantasy-logos/manifest.json')); print('ESPN logos cached:',sum(bool(t['cached']) for t in d['teams'].values()),'of',len(d['teams']))"
      - name: Recover invalid/regressed feeds and enforce freshness gate
        if: always()
        run: |
          python scripts/verified_data_guard.py check || {
            echo "::error::Critical ESPN/NFL feed unavailable, stale or invalid. Gazette deployment blocked; previous live Pages release remains intact."
            exit 1
          }
      - name: Write data-health status to Actions job summary
        if: always()
        run: |
          if [ -f monitor/backup-artifact/health-report.md ]; then
            cat monitor/backup-artifact/health-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Data health report unavailable; inspect this workflow run." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve checksummed verified snapshots for 90 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gazette-verified-snapshots-${{ github.run_id }}
          path: monitor/backup-artifact/
          if-no-files-found: ignore
          retention-days: 90
      - name: Produce factual 48-hour Page One and fictional daily Page Two
        run: python scripts/build_newspaper_pages.py
      - name: Generate per-section daily verification with source comparisons
        run: python scripts/gazette_section_audit.py
      - name: Validate refreshed data and report freshness
        run: |
          python scripts/qa_gazette.py
          python scripts/data_status.py
      - name: Security scan, construct allowlisted public site, and enforce browser CSP
        run: |
          python scripts/build_public_site.py
          python scripts/qa_public_site.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload allowlisted website artifact only
        id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Confirm artifact upload
        run: echo "Pages artifact upload step completed"
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Allow uploaded artifact to become available
        run: sleep 20
      - name: Deploy website to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
          timeout: 600000
          error_count: 5
          reporting_interval: 10000
