name: Security Audit - Public Gazette
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '41 11 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check Python and JavaScript
        run: |
          python -m py_compile scripts/*.py tests/test_public_security.py
          node --check assets/live-nfl-scores.js
      - name: Verify Pages publish allowlist and source code security tests
        run: |
          python -m unittest discover -s tests -p 'test_public_security.py' -v
          python scripts/build_public_site.py
          python scripts/qa_public_site.py
      - name: Confirm only public assets can be published
        run: |
          python - <<'PY'
          from pathlib import Path
          public=Path('public')
          assert public.is_dir()
          blocked=list(public.glob('**/*.py'))+list(public.glob('**/*DRAFT*'))
          blocked+=list(public.glob('**/.env*'))
          if blocked:raise SystemExit('Sensitive or development files in Pages artifact')
          print('No source scripts, private drafts, or environment files in publish artifact')
          PY
