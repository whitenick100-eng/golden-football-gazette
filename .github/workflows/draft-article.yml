name: Draft Gazette Article (approval required)
on:
  workflow_dispatch:
    inputs:
      article_type:
        description: Article format
        required: true
        default: daily-brief
        type: choice
        options:
          - daily-brief
          - week-preview
          - weekly-recap
permissions:
  contents: write
  pull-requests: write
jobs:
  editorial-draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check editorial agent prerequisites
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          test -n "$OPENAI_API_KEY" || { echo "Add OPENAI_API_KEY in repository Actions secrets first"; exit 1; }
          python -m py_compile scripts/draft_article.py
          python scripts/qa_gazette.py
      - name: Generate unpublished editorial draft
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GAZETTE_OPENAI_MODEL: gpt-4.1-mini
        run: python scripts/draft_article.py --type "${{ inputs.article_type }}"
      - name: Create approval-only pull request
        env:
          GH_TOKEN: ${{ github.token }}
          ARTICLE_TYPE: ${{ inputs.article_type }}
        run: |
          set -euo pipefail
          branch="editorial/draft-${{ github.run_id }}-${{ github.run_attempt }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add editorial/
          git commit -m "Draft Gazette ${ARTICLE_TYPE} for editor approval"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "EDITOR REVIEW: Gazette ${ARTICLE_TYPE} draft" --body "AI-generated **unpublished** article. Review every score, team name, date and projection. This PR does not change the live website. Merge only after editorial approval; a separate approved website integration is needed to display the article."
