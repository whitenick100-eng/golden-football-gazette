name: Gazette verified bulletin (manual fallback)
on:
  workflow_dispatch:
    inputs:
      article_type:
        description: Edition format (auto selects an appropriate daily edition)
        required: true
        default: auto
        type: choice
        options:
          - auto
          - daily-brief
          - week-preview
          - weekly-recap
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: golden-gazette-editorial
  cancel-in-progress: false
jobs:
  editorial-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check newspaper source and Python code
        run: |
          python -m py_compile scripts/*.py
          python -m unittest discover -s tests -p "test_editorial.py" -v
          python scripts/qa_gazette.py
      - name: Retrieve verified ESPN and NFL source data
        run: |
          python scripts/refresh_espn.py
          python scripts/refresh_nfl.py
          python scripts/refresh_nfl_injuries.py
          python scripts/refresh_player_leaders.py
          python scripts/build_weekly_features.py
          python scripts/qa_gazette.py
          python scripts/data_status.py
      - name: Write daily review-only edition
        env:
          OPENAI_API_KEY: ''
          ARTICLE_TYPE: ${{ github.event.inputs.article_type || 'auto' }}
        run: python scripts/draft_article.py --type "$ARTICLE_TYPE"
      - name: Prepare newspaper article for owner's approval
        env:
          GH_TOKEN: ${{ github.token }}
          ARTICLE_TYPE: ${{ github.event.inputs.article_type || 'auto' }}
          RUN_NUMBER: ${{ github.run_id }}
        run: |
          set -euo pipefail
          DATE_ET="$(TZ=America/New_York date +%Y-%m-%d)"
          BRANCH="editorial/daily-$DATE_ET-$RUN_NUMBER"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add editorial/
          if git diff --cached --quiet; then
            echo "No new editorial draft available; nothing to submit."
            exit 0
          fi
          git commit -m "Daily Gazette editorial draft for $DATE_ET"
          git push origin "$BRANCH"
          echo "Creating a PR for the owner's approval; no automatic publishing."
          if ! gh pr create --base main --head "$BRANCH" \
            --title "EDITOR REVIEW: Golden Football Gazette — $DATE_ET" \
            --body "Daily draft produced from timestamped, verified ESPN/NFL data. This manual fallback is a verified-data bulletin and makes no paid AI API calls. **Not published.** Review scores, dates, quotes, and editorial tone. Merge this PR only after approval; the live Gazette displays editorial/latest.json after merge."; then
            echo "::error::GitHub couldn't open the editorial PR. Under Settings > Actions > General, enable 'Allow GitHub Actions to create and approve pull requests' and ensure Workflow permissions permit write access. Branch: $BRANCH"
            exit 1
          fi
