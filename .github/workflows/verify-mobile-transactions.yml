name: Verify mobile stadium and NFL transactions
on:
  pull_request:
    paths:
      - 'index.html'
      - 'scripts/refresh_nfl_transactions.py'
      - 'scripts/build_weekly_features.py'
      - 'scripts/qa_gazette.py'
      - 'tests/test_nfl_transactions.py'
      - '.github/workflows/refresh-and-deploy.yml'
      - '.github/workflows/verify-mobile-transactions.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe accessible public NFL transactions sources
        run: |
          python - <<'PY'
          import urllib.request,urllib.error,json,re
          urls=[
            "https://sports.core.api.espn.com/v2/sports/football/leagues/nfl/transactions?limit=5",
            "https://site.api.espn.com/apis/site/v2/sports/football/nfl/transactions",
            "https://www.cbssports.com/nfl/transactions/",
          ]
          for url in urls:
            try:
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0","Accept":"application/json,text/html"})
              with urllib.request.urlopen(req,timeout=15) as resp:
                b=resp.read(180000)
                print("PROBE",url,"STATUS",resp.status,"TYPE",resp.headers.get("Content-Type"),"LENGTH",len(b))
                if 'json' in resp.headers.get("Content-Type",""):
                  d=json.loads(b)
                  print("JSON KEYS",list(d)[:25] if isinstance(d,dict) else type(d).__name__)
                  if isinstance(d,dict):
                    for k in ("count","pageCount","pageIndex","items","transactions"):
                      v=d.get(k)
                      print("field",k,("count="+str(len(v))+" sample="+str(v[0])[:350]) if isinstance(v,list) and v else str(v)[:100])
                else:
                  html=b.decode('utf-8','replace')
                  print("HTML HTML-TABLE-COUNT",html.lower().count('<table'),"DATE",bool(re.search(r'Nov(?:ember)?\s+20',html,re.I)))
            except Exception as exc:
              print("PROBE",url,"ERROR",type(exc).__name__,str(exc)[:180])
          PY
