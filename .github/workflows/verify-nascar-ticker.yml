name: Verify Official NASCAR.com Ticker
on:
  pull_request:
    paths:
      - 'assets/multisport-ticker.js'
      - 'scripts/refresh_nascar.py'
      - 'tests/test_nascar_com_ticker.py'
      - 'tests/test_multisport_ticker.js'
      - 'scripts/build_public_site.py'
      - '.github/workflows/refresh-and-deploy.yml'
      - '.github/workflows/verify-nascar-ticker.yml'
permissions:
  contents: read
jobs:
  verify-nascar-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate all ticker JavaScript and NASCAR.com-only parsing tests
        run: |
          node --check assets/multisport-ticker.js
          node tests/test_multisport_ticker.js
          python -m py_compile scripts/refresh_nascar.py
          python -m unittest discover -s tests -p 'test_nascar_com_ticker.py' -v
      - name: Verify official NASCAR.com Cup race results and schedule
        run: |
          python scripts/refresh_nascar.py
          python - <<'PY'
          import json
          from pathlib import Path
          doc=json.loads(Path('data/nascar-ticker.json').read_text())
          print('NASCAR official source:',doc['source'],'status:',doc['status'],
                'headlines:',len(doc.get('articles',[])),
                'verified race results:',len(doc.get('results',[])),
                'upcoming:',len(doc.get('upcoming',[])))
          assert doc['source']=='NASCAR.com'
          assert doc['status']=='available', 'NASCAR-owned official Cup feeds unavailable'
          assert doc['results'] or doc['upcoming'] or doc['articles'], 'No official NASCAR.com items found'
          assert all(row['url'].startswith('https://www.nascar.com/')
                     for group in ('articles','results','upcoming')
                     for row in doc[group])
          assert all(row['verification']=='NASCAR.com official Cup weekend race results'
                     and row['status']=='final' and row['winner']
                     for row in doc['results'])
          assert all(row['status']=='scheduled' and
                     row['verification']=='NASCAR.com official Cup race schedule'
                     for row in doc['upcoming'])
          PY
